packages:
  - packages/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  puppeteer: false
  sharp: true

catalogMode: strict

catalogs:
  ui:
    surimi: ^0.9.0
    "sanitize.css": "^13.0.0"
  build:
    "@astrojs/rss": ^4.0.19
    "@astrojs/sitemap": ^3.7.4
    "astro-pdf": ^1.10.1
    "@brandonaaron/astro-script-embed": "^1.0.3"
    "@shikijs/transformers": ^4.5.0
    "astro-webmanifest": "^1.0.0"
    "astro": ^7.3.5
    "sanitize-html": ^2.18.0
    "sharp": ^0.35.5
    cssnano: ^9.1.2
    postcss: ^8.5.28
    sass: ^1.105.1
    typescript: ^7.0.2
    vite-plugin-static-copy: ^3.4.0
    vite: ^7.3.6
  fonts:
    "@fontsource/ibm-plex-mono": ^5.3.0
    "@fortawesome/fontawesome-svg-core": ^7.3.1
    "@fortawesome/free-brands-svg-icons": ^7.3.1
    "@fortawesome/free-solid-svg-icons": ^7.3.1
  format:
    "@ianvs/prettier-plugin-sort-imports": ^4.7.1
    prettier: ^3.9.9
    prettier-plugin-packagejson: ^3.0.2
  lint:
    "@eslint/eslintrc": ^3.3.7
    "@eslint/js": ^10.0.1
    eslint: ^10.11.0
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^7.1.1
    jiti: ^2.7.0
    typescript-eslint: ^8.71.0
  script:
    taze: ^21.3.0
  types:
    "@types/node": ^26.6.3
    "@types/sanitize-html": ^2.16.2

minimumReleaseAgeExclude:
  - "@surimi/common@0.9.0"
  - "@surimi/compiler@0.9.0"
  - "@surimi/conditional@0.9.0"
  - "@surimi/core@0.9.0"
  - "@surimi/theme@0.9.0"
  - surimi@0.9.0
  - vite-plugin-surimi@0.9.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - sharp
  - workerd

overrides:
  rollup: npm:@rollup/wasm-node

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
